<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden; background: #000;
      }
      .video-container {
        width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #000; position: relative;
      }
      video { width: 100%; height: 100%; object-fit: contain; }

      @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50%      { transform: translateX(-50%) scale(1.05); }
      }

      #playPauseBtn {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 90px; height: 90px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 38px;
        line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease, background 0.2s ease;
        z-index: 10;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation; /* prevents double-tap zoom, cleans up touch handling */
      }
      #playPauseBtn:hover { background: rgba(0, 0, 0, 0.75); }
      #playPauseBtn.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video id="video" autoplay muted playsinline controls>
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>

      <button id="playPauseBtn" aria-label="Play/Pause">⏸</button>
      <div id="soundHint">🔊 Tap anywhere for sound</div>
    </div>

    <script>
      const video = document.getElementById("video");
      const playPauseBtn = document.getElementById("playPauseBtn");

      // 1. Autoplay muted
      video.play().catch((err) => console.log("Autoplay blocked:", err));

      // 2. Unmute on first interaction
      let audioEnabled = false;
      const enableAudio = () => {
        if (audioEnabled) return;
        audioEnabled = true;
        video.muted = false;
        video.volume = 1;
        video.play().catch((err) => console.log("Play error:", err));
        hint.classList.add("hidden");
        ["click", "touchstart", "touchend", "keydown", "pointerdown", "scroll"]
          .forEach((evt) => document.removeEventListener(evt, enableAudio));
      };
      ["click", "touchstart", "touchend", "keydown", "pointerdown", "scroll"]
        .forEach((evt) => document.addEventListener(evt, enableAudio, { passive: true }));
      hint.addEventListener("click", enableAudio);

      // ---- Play/Pause button ----
      const updateButton = () => {
        if (video.paused) {
          playPauseBtn.textContent = "▶";
          playPauseBtn.classList.remove("hidden");
        } else {
          playPauseBtn.textContent = "⏸";
          playPauseBtn.classList.add("hidden");
        }
      };

      // ✅ FIX: only listen for "click" — no touchstart duplicate
      const togglePlay = (e) => {
        e.stopPropagation();
        e.preventDefault();
        if (video.paused) {
          video.play().catch((err) => console.log("Play error:", err));
        } else {
          video.pause();
        }
      };

      playPauseBtn.addEventListener("click", togglePlay);

      video.addEventListener("play", updateButton);
      video.addEventListener("pause", updateButton);
      video.addEventListener("ended", updateButton);

      // Show button briefly on hover / touch of video area
      const container = document.querySelector(".video-container");
      let hideTimer;
      const showButtonTemporarily = () => {
        playPauseBtn.classList.remove("hidden");
        clearTimeout(hideTimer);
        if (!video.paused) {
          hideTimer = setTimeout(() => {
            if (!video.paused) playPauseBtn.classList.add("hidden");
          }, 2000);
        }
      };
      container.addEventListener("mousemove", showButtonTemporarily);
      container.addEventListener("touchstart", showButtonTemporarily, { passive: true });

      updateButton();
    </script>
  </body>
</html>
