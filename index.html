<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%;
        overflow: hidden; background: #000;
      }
      .video-container {
        width: 100vw; height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #000; position: relative;
      }
      video { width: 100%; height: 100%; object-fit: contain; }

      #soundHint {
        position: absolute;
        bottom: 160px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        text-align: center;
        padding: 12px 24px;
        border-radius: 30px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.4s ease;
        animation: pulse 1.8s infinite;
      }
      #soundHint.hidden { opacity: 0; pointer-events: none; }

      @keyframes pulse {
        0%, 100% { transform: translateX(-50%) scale(1); }
        50%      { transform: translateX(-50%) scale(1.05); }
      }

      .controls-bar {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        z-index: 10;
      }

      .float-btn {
        width: 64px; height: 64px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.3s ease, transform 0.15s ease, background 0.2s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        backdrop-filter: blur(6px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      .float-btn:hover { background: rgba(0, 0, 0, 0.8); }
      .float-btn:active { transform: scale(0.9); }
      .float-btn.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video id="video" autoplay muted playsinline controls>
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>

      <div class="controls-bar">
        <button id="playPauseBtn" class="float-btn" aria-label="Play/Pause">⏸</button>
        <button id="muteBtn" class="float-btn" aria-label="Mute/Unmute">🔇</button>
      </div>

      <div id="soundHint">🔊 Tap anywhere for sound</div>
    </div>

    <script>
      const video = document.getElementById("video");
      const hint = document.getElementById("soundHint");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const muteBtn = document.getElementById("muteBtn");

      // 1. Autoplay muted
      video.play().catch((err) => console.log("Autoplay blocked:", err));

      // 2. Unmute on first interaction ANYWHERE (except on our buttons)
      let audioEnabled = false;
      const enableAudio = () => {
        if (audioEnabled) return;
        audioEnabled = true;
        video.muted = false;
        video.volume = 1;
        video.play().catch((err) => console.log("Play error:", err));
        hint.classList.add("hidden");
        updateMuteButton();
        ["click", "touchstart", "touchend", "keydown", "pointerdown", "scroll"]
          .forEach((evt) => document.removeEventListener(evt, enableAudio));
      };
      ["click", "touchstart", "touchend", "keydown", "pointerdown", "scroll"]
        .forEach((evt) => document.addEventListener(evt, enableAudio, { passive: true }));
      hint.addEventListener("click", enableAudio);

      // ---- Play/Pause button ----
      const updateButton = () => {
        if (video.paused) {
          playPauseBtn.textContent = "▶";
          playPauseBtn.classList.remove("hidden");
        } else {
          playPauseBtn.textContent = "⏸";
          playPauseBtn.classList.add("hidden");
        }
      };

      const togglePlay = (e) => {
        // Stop the tap from bubbling up to document → enableAudio
        e.stopPropagation();
        e.preventDefault();
        if (video.paused) {
          video.play().catch((err) => console.log("Play error:", err));
        } else {
          video.pause();
        }
      };

      playPauseBtn.addEventListener("click", togglePlay);
      // Block the earlier touch events from reaching document listeners
      ["touchstart", "touchend", "pointerdown"].forEach((evt) =>
        playPauseBtn.addEventListener(evt, (e) => e.stopPropagation(), { passive: true })
      );

      video.addEventListener("play", updateButton);
      video.addEventListener("pause", updateButton);
      video.addEventListener("ended", updateButton);

      // ---- Mute / Unmute button ----
      const updateMuteButton = () => {
        if (video.muted || video.volume === 0) {
          muteBtn.textContent = "🔇";
        } else {
          muteBtn.textContent = "🔊";
        }
        muteBtn.classList.remove("hidden");
      };

      const toggleMute = (e) => {
        e.stopPropagation();
        e.preventDefault();
        video.muted = !video.muted;
        updateMuteButton();
      };

      muteBtn.addEventListener("click", toggleMute);
      ["touchstart", "touchend", "pointerdown"].forEach((evt) =>
        muteBtn.addEventListener(evt, (e) => e.stopPropagation(), { passive: true })
      );

      video.addEventListener("volumechange", updateMuteButton);

      // Show both buttons briefly on hover / touch of video area
      const container = document.querySelector(".video-container");
      let hideTimer;
      const showButtonTemporarily = () => {
        playPauseBtn.classList.remove("hidden");
        muteBtn.classList.remove("hidden");
        clearTimeout(hideTimer);
        if (!video.paused) {
          hideTimer = setTimeout(() => {
            if (!video.paused) playPauseBtn.classList.add("hidden");
          }, 2000);
        }
      };
      container.addEventListener("mousemove", showButtonTemporarily);
      container.addEventListener("touchstart", showButtonTemporarily, { passive: true });

      // Initial state
      updateButton();
      updateMuteButton();
    </script>
  </body>
</html>
