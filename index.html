<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .video-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #soundHint {
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 16px;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.4s ease;
        animation: pulse 1.8s infinite;
      }
      #soundHint.hidden {
        opacity: 0;
        pointer-events: none;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
        }
        50% {
          transform: translateX(-50%) scale(1.05);
        }
      }

      /* ---- Custom play/pause button ---- */
      #playPauseBtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 38px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease, background 0.2s ease;
        z-index: 10;
        -webkit-tap-highlight-color: transparent;
      }
      #playPauseBtn:hover {
        background: rgba(0, 0, 0, 0.75);
      }
      #playPauseBtn.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video id="video" autoplay muted playsinline >
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>

      <!-- Custom play/pause button -->
      <button id="playPauseBtn" aria-label="Play/Pause">⏸</button>

      <div id="soundHint">🔊 Tap anywhere for sound</div>
    </div>

    <script>
      const video = document.getElementById("video");
      const hint = document.getElementById("soundHint");
      const playPauseBtn = document.getElementById("playPauseBtn");

      // 1. Autoplay muted (works everywhere)
      video.play().catch((err) => console.log("Autoplay blocked:", err));

      // 2. Unmute on first interaction
      let audioEnabled = false;

      const enableAudio = () => {
        if (audioEnabled) return;
        audioEnabled = true;

        video.muted = false;
        video.volume = 1;
        video.play().catch((err) => console.log("Play error:", err));

        hint.classList.add("hidden");

        [
          "click",
          "touchstart",
          "touchend",
          "keydown",
          "pointerdown",
          "scroll",
        ].forEach((evt) => document.removeEventListener(evt, enableAudio));
      };

      [
        "click",
        "touchstart",
        "touchend",
        "keydown",
        "pointerdown",
        "scroll",
      ].forEach((evt) =>
        document.addEventListener(evt, enableAudio, { passive: true }),
      );

      video.addEventListener("click", enableAudio);
      hint.addEventListener("click", enableAudio);

      // ---- Play/Pause button logic ----
      const updateButton = () => {
        if (video.paused) {
          playPauseBtn.textContent = "▶";
          playPauseBtn.classList.remove("hidden");
        } else {
          playPauseBtn.textContent = "⏸";
          // Hide the button while playing (still clickable via video area)
          playPauseBtn.classList.add("hidden");
        }
      };

      const togglePlay = (e) => {
        e.stopPropagation();
        if (video.paused) {
          video.play().catch((err) => console.log("Play error:", err));
        } else {
          video.pause();
        }
      };

      playPauseBtn.addEventListener("click", togglePlay);
      playPauseBtn.addEventListener("touchstart", togglePlay, { passive: false });

      // Keep button state in sync with the video
      video.addEventListener("play", updateButton);
      video.addEventListener("pause", updateButton);
      video.addEventListener("ended", updateButton);

      // Show the button briefly when the user hovers/taps the video area
      const container = document.querySelector(".video-container");
      let hideTimer;

      const showButtonTemporarily = () => {
        if (video.paused) {
          playPauseBtn.classList.remove("hidden");
          return;
        }
        playPauseBtn.classList.remove("hidden");
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          if (!video.paused) playPauseBtn.classList.add("hidden");
        }, 2000);
      };

      container.addEventListener("mousemove", showButtonTemporarily);
      container.addEventListener("touchstart", showButtonTemporarily, {
        passive: true,
      });

      // Initial state
      updateButton();
    </script>
  </body>
</html>
